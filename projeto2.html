<!DOCTYPE html>
<html lang="br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Finalizar Compra</h1>
    <form>
        <fieldset>
            <legend>Endereço de Entrega</legend>
            <label for="nome">Nome do Destinatário:</label>
            <input type="text" id="nome_obr" name="nome">
            <br>
            <br>
            <label for="cep">CEP:</label>
            <input type="text" id="cep_obr" cep="cep" required placeholder="00000-000">
            <br>
            <br>
            <label for="rua">Rua:</label>
            <input type="text" id="rua_obr" rua="rua" required>
            <br>
            <br>
            <label for="numero">Número</label>
            <input type="number" id="numero_obr" namber="numero" required>
            <br>
            <br>
            <label for="complemento">Complemento:</label>
            <input type="text" id="complemento_obr" complemento="complemento" required placeholder="Apto, Bloco, Ponto de referência">
            <br>
            <br>
        </fieldset>
        <br>
        <fieldset>
            <legend>Opção de Entrega</legend>
            <label for="periodo_entrega">Período de Entega</label>
            <select for="periodo_entrega" name="periodo_entrega">
                <option value="ma">Manhã (08h-12h)</option>
                <option value="ta">Tarde (12h-18h)</option>
                <option value="no">Noite (18h-22h)</option>
            </select>
            <p>Instrução de entrega:</p>
            <input type="checkbox" id="dp" name="Deixar na portaia">
            <label for="dp">Deixar na portaria</label>
            <br>
            <input type="checkbox" id="em" name="Entregar em mãos">
            <label for="em">Entregar em mãos</label>
            <br>
            <input type="checkbox" id="lc" name="Ligar ao chegar">
            <label for="lc">Ligar ao chegar</label>
            <br>
            <br>
            <label for="cupom">Cupom de Desconto</label>
            <input type="text" id="cupom_obr" name="cupom" placeholder="Insira seu cupom">
            <br>
            <br>
            <input type="checkbox" id="ofertawhats" name="ofertawhats">
            <label fot="ofertawhats">Receber Desconto no WhathsApp</label>
        </fieldset>
        <br>
        <button type="submit">Finalizar Compra</button>
    </form>
    
</body>
</html>
